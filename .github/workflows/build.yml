name: Bina APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Guna keystore debug tetap (elak konflik tandatangan)
        run: |
          mkdir -p ~/.android
          cp .github/keystore/debug.keystore ~/.android/debug.keystore

      - name: Jana folder platform android
        run: flutter create . --project-name muslim_smart_kids --platforms android

      - name: Pasang pakej
        run: flutter pub get

      - name: Tukar nama aplikasi kepada "Humaira Smart Kids"
        run: |
          sed -i 's/android:label="muslim_smart_kids"/android:label="Humaira Smart Kids"/' android/app/src/main/AndroidManifest.xml
          grep 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Jana ikon aplikasi
        run: dart run flutter_launcher_icons

      - name: Bina APK release
        run: flutter build apk --release

      - name: Muat naik APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
